# cargo-deny policy, taken from zakura-core/zakura deny.toml (main cb148173).
#
# Copied: the license allow-list, the ban on duplicate versions, the openssl ban and the
# source policy. Left out: Zakura's own advisory ignores, license clarifications and
# duplicate-version skips. Those name crates of Zakura's tree, and none was added here.
# The CI job runs `cargo deny --workspace check bans licenses sources`, as Zakura does.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "CDDL-1.0",
]
exceptions = []

[bans]
multiple-versions = "deny"
# Zakura allows wildcards (with a TODO to deny them); the workspace path dependencies here
# carry no version.
wildcards = "allow"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
